<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora — Versão Base</title>
<style>
  :root {
    --navy-900: #0b1e3f;
    --navy-800: #122a54;
    --navy-700: #1a3a6e;
    --cyan: #22d3e5;
    --ink: #eaf2ff;
    --muted: #8fa3c4;
    --danger: #ff6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #16305e, var(--navy-900) 65%);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .tag {
    position: fixed;
    top: 18px;
    left: 18px;
    font-size: 13px;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: .02em;
  }

  .calc {
    width: 320px;
    background: var(--navy-800);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.06);
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 14px 4px;
    color: var(--muted);
  }

  #visor {
    width: 100%;
    height: 74px;
    margin-bottom: 16px;
    background: #081428;
    border: 1px solid rgba(34,211,229,.25);
    border-radius: 14px;
    color: var(--cyan);
    font-family: "Courier New", monospace;
    font-size: 30px;
    text-align: right;
    padding: 10px 16px;
    outline: none;
  }

  .linha {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  button {
    flex: 1;
    height: 54px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    background: var(--navy-700);
    color: var(--ink);
    transition: transform .05s ease;
  }

  button:active { transform: scale(.95); }

  .op { background: #1f4c8f; }
  .igual { background: var(--cyan); color: #04222b; }
  .limpar { background: var(--danger); color: #2b0505; }
</style>
</head>
<body>

  <div class="tag">versão base — sem refatoração</div>

  <div class="calc">
    <h1>Calculadora Simples</h1>
    <input type="text" id="visor" value="0" readonly>

    <div class="linha">
      <button onclick="limpaTudo()" class="limpar">C</button>
      <button onclick="apagaUltimo()">⌫</button>
      <button onclick="colocaNaTela('%')">%</button>
      <button onclick="colocaNaTela('/')" class="op">÷</button>
    </div>
    <div class="linha">
      <button onclick="colocaNaTela('7')">7</button>
      <button onclick="colocaNaTela('8')">8</button>
      <button onclick="colocaNaTela('9')">9</button>
      <button onclick="colocaNaTela('*')" class="op">×</button>
    </div>
    <div class="linha">
      <button onclick="colocaNaTela('4')">4</button>
      <button onclick="colocaNaTela('5')">5</button>
      <button onclick="colocaNaTela('6')">6</button>
      <button onclick="colocaNaTela('-')" class="op">−</button>
    </div>
    <div class="linha">
      <button onclick="colocaNaTela('1')">1</button>
      <button onclick="colocaNaTela('2')">2</button>
      <button onclick="colocaNaTela('3')">3</button>
      <button onclick="colocaNaTela('+')" class="op">+</button>
    </div>
    <div class="linha">
      <button onclick="colocaNaTela('0')" style="flex:2">0</button>
      <button onclick="colocaNaTela('.')">.</button>
      <button onclick="calcula()" class="igual">=</button>
    </div>
  </div>

<script>
  // ---------------------------------------------------------
  // VERSÃO BASE - "Antes"
  // Código funcional, mas ingênuo: variável global solta,
  // uso de eval(), concatenação de string sem validação,
  // sem tratamento de erros (divisão por zero quebra a tela),
  // tudo misturado numa única função gigante.
  // ---------------------------------------------------------

  var expressao = "";

  function colocaNaTela(valor) {
    if (expressao == "0") {
      expressao = "";
    }
    expressao = expressao + valor;
    document.getElementById("visor").value = expressao;
  }

  function apagaUltimo() {
    expressao = expressao.substring(0, expressao.length - 1);
    if (expressao == "") {
      expressao = "0";
    }
    document.getElementById("visor").value = expressao;
  }

  function limpaTudo() {
    expressao = "0";
    document.getElementById("visor").value = expressao;
  }

  function calcula() {
    var resultado = eval(expressao); // nada de tratamento de erro aqui
    expressao = resultado;
    document.getElementById("visor").value = resultado;
  }
</script>

</body>
</html>
