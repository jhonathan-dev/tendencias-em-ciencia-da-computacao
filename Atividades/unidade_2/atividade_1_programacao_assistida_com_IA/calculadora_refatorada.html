<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora — Versão Refatorada</title>
<style>
  :root {
    --navy-900: #0b1e3f;
    --navy-800: #122a54;
    --navy-700: #1a3a6e;
    --cyan: #22d3e5;
    --ink: #eaf2ff;
    --muted: #8fa3c4;
    --danger: #ff6b6b;
    --ok: #4ade80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #16305e, var(--navy-900) 65%);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .tag {
    position: fixed;
    top: 18px;
    left: 18px;
    font-size: 13px;
    color: var(--ok);
    border: 1px solid var(--ok);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: .02em;
  }

  .calc {
    width: 320px;
    background: var(--navy-800);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.06);
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px 4px;
    color: var(--muted);
  }

  .subtitulo {
    font-size: 12px;
    margin: 0 0 14px 4px;
    color: var(--muted);
    opacity: .7;
  }

  #visor {
    display: block;
    width: 100%;
    height: 74px;
    line-height: 74px;
    margin-bottom: 16px;
    background: #081428;
    border: 1px solid rgba(34,211,229,.25);
    border-radius: 14px;
    color: var(--cyan);
    font-family: "Courier New", monospace;
    font-size: 28px;
    text-align: right;
    padding: 0 16px;
    outline: none;
    transition: border-color .15s ease;
    overflow: hidden;
    white-space: nowrap;
  }

  #visor.erro {
    color: var(--danger);
    border-color: rgba(255,107,107,.5);
  }

  .linha {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  button {
    flex: 1;
    height: 54px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    background: var(--navy-700);
    color: var(--ink);
    transition: transform .05s ease, filter .15s ease;
  }

  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(.95); }

  .op { background: #1f4c8f; }
  .igual { background: var(--cyan); color: #04222b; }
  .limpar { background: var(--danger); color: #2b0505; }
</style>
</head>
<body>

  <p class="tag" role="note">versão refatorada — Human + IA</p>

  <main class="calc" aria-label="Calculadora simples">
    <header>
      <h1>Calculadora Simples</h1>
      <p class="subtitulo">refatorada com apoio de IA</p>
    </header>

    <output id="visor" for="teclado" aria-live="polite">0</output>

    <div id="teclado" class="teclado" role="group" aria-label="Teclado da calculadora">
      <div class="linha">
        <button type="button" data-action="clear" class="limpar" aria-label="Limpar tudo">C</button>
        <button type="button" data-action="backspace" aria-label="Apagar último dígito">⌫</button>
        <button type="button" data-value="%" aria-label="Porcentagem">%</button>
        <button type="button" data-value="/" class="op" aria-label="Dividir">÷</button>
      </div>
      <div class="linha">
        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button type="button" data-value="*" class="op" aria-label="Multiplicar">×</button>
      </div>
      <div class="linha">
        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button type="button" data-value="-" class="op" aria-label="Subtrair">−</button>
      </div>
      <div class="linha">
        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-value="+" class="op" aria-label="Somar">+</button>
      </div>
      <div class="linha">
        <button type="button" data-value="0" style="flex:2" aria-label="Zero">0</button>
        <button type="button" data-value="." aria-label="Ponto decimal">.</button>
        <button type="button" data-action="equals" class="igual" aria-label="Calcular resultado">=</button>
      </div>
    </div>
  </main>

<script>
  // -----------------------------------------------------------------
  // VERSÃO REFATORADA - "Depois"
  //
  // Melhorias sugeridas pela IA e validadas pelo humano:
  //  1. Estado isolado num objeto (sem variáveis globais soltas).
  //  2. Nenhum uso de eval() -> parser + cálculo manual e seguro.
  //  3. Tratamento explícito de erros (ex.: divisão por zero).
  //  4. Separação de responsabilidades: estado, cálculo e DOM
  //     em funções pequenas e nomeadas.
  //  5. Uso de addEventListener + data-attributes no lugar de
  //     onclick inline no HTML.
  //  6. Marcação semântica: <header>/<main> como landmarks, <output>
  //     para o visor (em vez de <input readonly>) e aria-label em
  //     cada botão simbólico, para leitores de tela.
  // -----------------------------------------------------------------

  const visor = document.getElementById("visor");

  const estado = {
    expressao: "0",
    comErro: false,
  };

  function atualizaVisor() {
    visor.textContent = estado.expressao;
    visor.classList.toggle("erro", estado.comErro);
  }

  function digitar(valor) {
    if (estado.comErro) {
      // depois de um erro, qualquer novo dígito reinicia a expressão
      estado.expressao = "0";
      estado.comErro = false;
    }
    estado.expressao = estado.expressao === "0" ? valor : estado.expressao + valor;
    atualizaVisor();
  }

  function apagarUltimo() {
    if (estado.comErro) {
      limparTudo();
      return;
    }
    estado.expressao = estado.expressao.slice(0, -1) || "0";
    atualizaVisor();
  }

  function limparTudo() {
    estado.expressao = "0";
    estado.comErro = false;
    atualizaVisor();
  }

  // Calcula a expressão sem usar eval(), token a token.
  // Suporta apenas os operadores usados nesta calculadora: + - * / %
  function calcularExpressao(expressao) {
    const tokens = expressao.match(/(\d+\.?\d*|[+\-*/%])/g);
    if (!tokens || tokens.length === 0) {
      throw new Error("Expressão inválida");
    }

    // primeira passada: resolve * / % (precedência maior)
    const pilha = [Number(tokens[0])];
    for (let i = 1; i < tokens.length; i += 2) {
      const operador = tokens[i];
      const proximo = Number(tokens[i + 1]);

      if (["*", "/", "%"].includes(operador)) {
        const anterior = pilha.pop();
        pilha.push(aplicarOperador(operador, anterior, proximo));
      } else {
        pilha.push(operador, proximo);
      }
    }

    // segunda passada: resolve + - (precedência menor)
    let resultado = pilha[0];
    for (let i = 1; i < pilha.length; i += 2) {
      resultado = aplicarOperador(pilha[i], resultado, pilha[i + 1]);
    }

    return resultado;
  }

  function aplicarOperador(operador, a, b) {
    switch (operador) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "%": return a % b;
      case "/":
        if (b === 0) {
          throw new Error("Divisão por zero");
        }
        return a / b;
      default:
        throw new Error("Operador desconhecido: " + operador);
    }
  }

  function calcular() {
    try {
      const resultado = calcularExpressao(estado.expressao);
      estado.expressao = String(Number(resultado.toFixed(10)));
      estado.comErro = false;
    } catch (erro) {
      estado.expressao = erro.message === "Divisão por zero" ? "Erro: ÷0" : "Erro";
      estado.comErro = true;
    }
    atualizaVisor();
  }

  // Delegação de eventos: um único listener para todos os botões
  document.querySelectorAll("button").forEach((botao) => {
    botao.addEventListener("click", () => {
      const { value, action } = botao.dataset;
      if (value !== undefined) return digitar(value);
      if (action === "clear") return limparTudo();
      if (action === "backspace") return apagarUltimo();
      if (action === "equals") return calcular();
    });
  });

  atualizaVisor();
</script>

</body>
</html>
